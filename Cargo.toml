[package]
name = "sqlite-tantivy"
version = "0.1.0"
edition = "2021"
description = "SQLite extension providing Tantivy-powered full-text search with FTS5-compatible API"
license = "MIT"
repository = "https://github.com/russellromney/sqlite-tantivy"
keywords = ["sqlite", "tantivy", "full-text-search", "fts5", "search"]
categories = ["database", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sqlite-loadable = "0.0.6-alpha.6"
tantivy = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
once_cell = "1.19"
regex = "1.10"
tantivy-common = "0.7"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }
tempfile = "3.0"

[profile.release]
lto = true
codegen-units = 1

# Patch sqlite-loadable to fix determine_update_operation bug
# See: https://github.com/asg017/sqlite-loadable-rs/pull/26
[patch.crates-io]
sqlite-loadable = { path = "patches/sqlite-loadable" }
