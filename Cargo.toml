[package]
name = "sqlite-tantivy"
version = "0.1.0"
edition = "2021"
description = "SQLite extension providing Tantivy-powered full-text search with FTS5-compatible API"
license = "Apache-2.0"
repository = "https://github.com/russellromney/sqlite-tantivy"
keywords = ["sqlite", "tantivy", "full-text-search", "fts5", "search"]
categories = ["database", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Using forked version with INSERT fix until upstream PR is merged
# See: https://github.com/asg017/sqlite-loadable-rs/pull/26
sqlite-loadable = { git = "https://github.com/russellromney/sqlite-loadable-rs", branch = "fix-determine-update-operation-insert" }
tantivy = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
once_cell = "1.19"
regex = "1.10"
tantivy-common = "0.7"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }
tempfile = "3.0"

[profile.release]
lto = true
codegen-units = 1
