[package]
name = "sqlite-tantivy"
version = "0.1.0"
edition = "2021"
description = "SQLite extension providing Tantivy-powered full-text search with FTS5-compatible API"
license = "Apache-2.0"
repository = "https://github.com/russellromney/sqlite-tantivy"
keywords = ["sqlite", "tantivy", "full-text-search", "fts5", "search"]
categories = ["database", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tantivy-bench"
path = "bin/tantivy-bench.rs"

[dependencies]
# Using local fork with INSERT fix + bind_blob/bind_null additions
sqlite-loadable = { path = "../sqlite-loadable-rs" }
tantivy = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
once_cell = "1.19"
regex = "1.10"
tantivy-common = "0.7"
rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = true
codegen-units = 1
